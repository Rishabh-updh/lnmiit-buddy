<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNMIIT Companion - Icon Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f1a;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(30, 30, 47, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .icon-card {
            background: rgba(15, 15, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .canvas-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080811;
            border-radius: 12px;
            padding: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }
        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }
        .card-label {
            font-weight: 600;
            font-size: 1rem;
        }
        .card-dim {
            font-size: 0.8rem;
            color: #64748b;
        }
        .btn {
            background: linear-gradient(135deg, #800020, #b91c1c);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 14px rgba(185, 28, 28, 0.35);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(185, 28, 28, 0.5);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .batch-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 PWA Icon Generator</h1>
        <p class="subtitle">Renders vector icons into high-definition PNGs for LNMIIT College Companion</p>

        <div class="icons-grid">
            <!-- 192x192 Icon -->
            <div class="icon-card">
                <span class="card-label">App Icon 192</span>
                <span class="card-dim">192 &times; 192 PNG</span>
                <div class="canvas-wrap">
                    <canvas id="canvas-192" width="192" height="192" style="width: 96px; height: 96px;"></canvas>
                </div>
                <button class="btn" onclick="downloadIcon('canvas-192', 'icon-192.png')">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download 192px
                </button>
            </div>

            <!-- 512x512 Icon -->
            <div class="icon-card">
                <span class="card-label">App Icon 512</span>
                <span class="card-dim">512 &times; 512 PNG</span>
                <div class="canvas-wrap">
                    <canvas id="canvas-512" width="512" height="512" style="width: 96px; height: 96px;"></canvas>
                </div>
                <button class="btn" onclick="downloadIcon('canvas-512', 'icon-512.png')">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download 512px
                </button>
            </div>
        </div>

        <div class="batch-actions">
            <button class="btn" onclick="downloadAll()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download Both PNGs
            </button>
            <a href="../index.html" class="btn btn-outline">Back to App</a>
        </div>
    </div>

    <script>
        function drawGraduationCap(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 512;
            
            // Background
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, size, size);

            ctx.save();
            ctx.scale(scale, scale);
            ctx.translate(0, 10);

            // Skull Cap Base
            ctx.fillStyle = '#800020';
            ctx.beginPath();
            ctx.moveTo(147, 245);
            ctx.lineTo(147, 320);
            ctx.bezierCurveTo(147, 368, 195, 397, 256, 397);
            ctx.bezierCurveTo(317, 397, 365, 368, 365, 320);
            ctx.lineTo(365, 245);
            ctx.fill();

            // Skull Cap Highlight Curve
            ctx.strokeStyle = '#991b1b';
            ctx.lineWidth = 9.5;
            ctx.beginPath();
            ctx.moveTo(147, 258);
            ctx.bezierCurveTo(187, 295, 325, 295, 365, 258);
            ctx.stroke();

            // Mortarboard 3D Depth Brim
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(85, 208);
            ctx.lineTo(256, 288);
            ctx.lineTo(427, 208);
            ctx.lineTo(427, 224);
            ctx.lineTo(256, 304);
            ctx.lineTo(85, 224);
            ctx.closePath();
            ctx.fill();

            // Mortarboard Top diamond
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(256, 128);
            ctx.lineTo(427, 208);
            ctx.lineTo(256, 288);
            ctx.lineTo(85, 208);
            ctx.closePath();
            ctx.fill();

            // Mortarboard Center Button
            ctx.fillStyle = '#800020';
            ctx.beginPath();
            ctx.arc(256, 208, 13, 0, Math.PI * 2);
            ctx.fill();

            // Tassel Cord
            ctx.strokeStyle = '#800020';
            ctx.lineWidth = 11;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(256, 208);
            ctx.bezierCurveTo(320, 216, 394, 237, 405, 290);
            ctx.lineTo(405, 373);
            ctx.stroke();

            // Tassel Fringe
            ctx.fillStyle = '#800020';
            ctx.beginPath();
            ctx.moveTo(389, 365);
            ctx.lineTo(421, 365);
            ctx.lineTo(427, 419);
            ctx.lineTo(383, 419);
            ctx.closePath();
            ctx.fill();

            // Tassel Gold Ring
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.roundRect(387, 371, 37, 8, 4);
            ctx.fill();

            ctx.restore();
        }

        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            downloadIcon('canvas-192', 'icon-192.png');
            setTimeout(() => {
                downloadIcon('canvas-512', 'icon-512.png');
            }, 300);
        }

        // Render on load
        window.addEventListener('DOMContentLoaded', () => {
            drawGraduationCap(document.getElementById('canvas-192'), 192);
            drawGraduationCap(document.getElementById('canvas-512'), 512);
        });
    </script>
</body>
</html>
